spring:
  datasource:
    url: jdbc:h2:file:./data/mock;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:sql/initH2.sql'
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
    path: h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
